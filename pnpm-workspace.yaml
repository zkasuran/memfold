packages:
  - "packages/*"
# pnpm blocks dependency build scripts by default. Approve the ones we trust.
# `allowBuilds` (map) is honored by pnpm 11.x+; `onlyBuiltDependencies` (list) covers pnpm 10.x.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  "@biomejs/biome": true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - "@biomejs/biome"
