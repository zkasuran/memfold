[package]
name = "memfold"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Thin blocking Rust client for the memfold daemon REST API: one common memory for every AI coding tool and agent framework."
repository = "https://github.com/engram-hq/memfold"
readme = "README.md"
keywords = ["memory", "ai", "llm", "agent", "client"]
categories = ["api-bindings"]
rust-version = "1.75"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mockito = "1"
